# Its own workspace, apart from the repository's: these apps install real packages so edgefit can
# be checked against them. Nothing here is published with edgefit.
packages:
  - '*'
minimumReleaseAgeExclude:
  - hono@4.13.11
  - next@16.3.8
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - source-map-js@1.2.2
# esbuild's install script only checks its own binary. These apps never run it, so it stays off.
allowBuilds:
  esbuild: false
# SvelteKit 2 pins cookie ^0.6.0. 0.7.0 fixes CVE-2024-47764 and keeps the same API.
overrides:
  cookie@<0.7.0: 0.7.2
