name: edgefit
description: Report the runtime compatibility findings a pull request adds or fixes
author: hamedniroomand
branding:
  icon: check-circle
  color: orange

inputs:
  targets:
    description: "Targets to check, separated by commas or spaces. Default: the config file's targets, then workerd"
    default: ''
  entry:
    description: "Entry point. Default: the config file's entry, then wrangler's main"
    default: ''
  working-directory:
    description: Project root, relative to the repository root
    default: .
  fail-on:
    description: 'When to fail: new-errors, errors or never'
    default: new-errors
  install-command:
    description: 'Installs the dependencies, run in the repository root of the base and the head. Default: chosen from the lockfile'
    default: ''
  edgefit-version:
    description: "edgefit version to run. Default: the version this action was released with. `source` builds the action's own checkout (deprecated)"
    default: ''
  edgefit-package:
    description: Path to an edgefit tarball to install instead of a release, to test a package before it is published
    default: ''
  github-token:
    description: Token for the pull request comment. Needs pull-requests write permission
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install edgefit
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EDGEFIT_VERSION: ${{ inputs.edgefit-version }}
        EDGEFIT_PACKAGE: ${{ inputs.edgefit-package }}
      run: '"$GITHUB_ACTION_PATH/action/install.sh"'

    - name: Find the base commit
      id: base
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        IDENTITY: ${{ steps.install.outputs.identity }}
        CACHE_INPUTS: ${{ inputs.targets }} | ${{ inputs.entry }} | ${{ inputs.working-directory }} | ${{ inputs.install-command }}
      run: '"$GITHUB_ACTION_PATH/action/base.sh"'

    - name: Restore the base report
      id: cache
      if: steps.base.outputs.has-base == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/edgefit/base.json
        key: ${{ steps.base.outputs.cache-key }}

    - name: Check the base
      id: base-check
      if: steps.base.outputs.has-base == 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BASE: ${{ steps.base.outputs.sha }}
        EDGEFIT: ${{ steps.install.outputs.cli }}
        TARGETS: ${{ inputs.targets }}
        ENTRY: ${{ inputs.entry }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: |
        worktree="$RUNNER_TEMP/edgefit-base"
        git worktree add --detach --force "$worktree" "$BASE"
        # A base without a checkable project, such as one before edgefit was set up, counts as empty.
        if ! "$GITHUB_ACTION_PATH/action/check.sh" "$worktree" "$RUNNER_TEMP/edgefit/base.json"; then
          echo '::warning::edgefit could not check the base commit, so every finding counts as new.'
          echo '{ "version": 1, "targets": [] }' > "$RUNNER_TEMP/edgefit/base.json"
          echo 'empty=true' >> "$GITHUB_OUTPUT"
        fi
        git worktree remove --force "$worktree"

    - name: Save the base report
      if: steps.base.outputs.has-base == 'true' && steps.cache.outputs.cache-hit != 'true' && steps.base-check.outputs.empty != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/edgefit/base.json
        key: ${{ steps.base.outputs.cache-key }}

    - name: Check the head
      shell: bash
      env:
        EDGEFIT: ${{ steps.install.outputs.cli }}
        TARGETS: ${{ inputs.targets }}
        ENTRY: ${{ inputs.entry }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: '"$GITHUB_ACTION_PATH/action/check.sh" "$PWD" "$RUNNER_TEMP/edgefit/head.json"'

    - name: Compare
      shell: bash
      env:
        EDGEFIT: ${{ steps.install.outputs.cli }}
      run: |
        cd "$RUNNER_TEMP/edgefit"
        node "$EDGEFIT" diff base.json head.json --fail-on never --format json > diff.json
        node "$EDGEFIT" diff base.json head.json --fail-on never --no-color | tee diff.txt

    - name: Write the job summary
      shell: bash
      run: |
        {
          echo '### edgefit'
          echo '```'
          cat "$RUNNER_TEMP/edgefit/diff.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on the pull request
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        # One comment per project and targets, found again by this marker on later pushes.
        MARKER: '<!-- edgefit ${{ inputs.working-directory }} ${{ inputs.targets }} -->'
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { comment } = await import(`${process.env.GITHUB_ACTION_PATH}/action/comment.js`);
          await comment({ github, context, core });

    - name: Annotate new findings
      shell: bash
      env:
        EDGEFIT: ${{ steps.install.outputs.cli }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        cd "$RUNNER_TEMP/edgefit"
        node "$EDGEFIT" diff base.json head.json --fail-on "$FAIL_ON" --format github
