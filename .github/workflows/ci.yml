name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: true
      - name: Install the sample apps
        working-directory: apps
        run: vp install --frozen-lockfile
      - run: vp run ready
      - name: Check the package (publint, are-the-types-wrong)
        run: |
          npx --yes publint --pack npm --strict .
          npx --yes @arethetypeswrong/cli --pack . --profile esm-only

  node-22:
    name: Tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '22'
          cache: true
          run-install: true
      - name: Install the sample apps
        working-directory: apps
        run: vp install --frozen-lockfile
      - run: vp test
