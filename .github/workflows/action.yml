name: Action

on:
  pull_request:
  # A push compares with the commit before it, and a manual run has no base at all.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  fixtures:
    name: Action on ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: worker
            targets: workerd
            entry: ''
          - fixture: bun-app
            targets: bun
            entry: src/index.ts
          - fixture: deno-app
            targets: deno, deno-deploy
            entry: src/main.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '22'
          cache: true
          run-install: true
      # The action installs the published package, which would test the previous release. Pack this
      # checkout instead, so the exact artifact that would be published is what runs.
      - name: Pack this checkout
        id: pack
        run: |
          vp run build
          vp pm pack --pack-destination "$RUNNER_TEMP/package"
          echo "tarball=$(ls "$RUNNER_TEMP"/package/edgefit-*.tgz)" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          edgefit-package: ${{ steps.pack.outputs.tarball }}
          working-directory: test/fixtures/${{ matrix.fixture }}
          targets: ${{ matrix.targets }}
          entry: ${{ matrix.entry }}
          # The fixtures have findings on purpose, so a PR that adds or changes one would always
          # "regress". This job checks the action runs end to end; diff tests cover fail-on.
          fail-on: never
