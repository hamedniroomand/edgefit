name: Action

on:
  pull_request:
  # A push compares with the commit before it, and a manual run has no base at all.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  fixtures:
    name: Action on ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: worker
            targets: workerd
            entry: ''
          - fixture: bun-app
            targets: bun
            entry: src/index.ts
          - fixture: deno-app
            targets: deno, deno-deploy
            entry: src/main.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # The action installs pnpm through corepack; setup-node's cache would look for it first.
          package-manager-cache: false
      - uses: ./
        with:
          working-directory: test/fixtures/${{ matrix.fixture }}
          targets: ${{ matrix.targets }}
          entry: ${{ matrix.entry }}
          # The fixtures have findings on purpose, so a PR that adds or changes one would always
          # "regress". This job checks the action runs end to end; diff tests cover fail-on.
          fail-on: never
