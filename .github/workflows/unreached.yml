name: Unreached data

# data/unreached.json says which code a package ships but a target never runs. It was read in
# one release, so each week it is checked against the latest one.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/unreached/check.mjs
