name: Preview

# Publishes an installable build of every pull request with pkg.pr.new (a GitHub App that must be
# installed on the repository), so its link shows on the pull request. Nothing is published to
# npm. Try a build with:
#   npx https://pkg.pr.new/edgefit@<pr-number>

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository_owner == 'hamedniroomand'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: true
      - run: vp run build
      - run: npx --yes pkg-pr-new@0.0.88 publish --compact --pnpm
