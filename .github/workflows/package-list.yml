name: Package list

on:
  pull_request:
    paths:
      - table/packages.json
      - scripts/package-table/**
      - .github/workflows/package-list.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: true
      - name: Validate the list
        run: node scripts/package-table/list.mjs
      - run: vp pack
      # Only packages this pull request adds are installed, so a request cannot make the job
      # install the whole list or anything that is not in it.
      - name: Check the added packages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/package-table/added.mjs "$BASE" > added.txt
          cat added.txt
          while read -r name; do
            npm view "$name" name > /dev/null || { echo "::error::$name is not on npm"; exit 1; }
            { echo "### $name"; echo '```'; node dist/cli/main.mjs package "$name" --no-color || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done < added.txt
