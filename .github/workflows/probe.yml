name: Probe

on:
  workflow_dispatch:
    inputs:
      discover:
        description: Probe every API in the matrix baseline, not only the curated ones
        type: boolean
        default: false
      open-issue:
        description: Also open, update or close the data drift issue, as the weekly run does
        type: boolean
        default: false
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

env:
  PROBE: scripts/probe
  SPEC: ${{ github.workspace }}/spec.json
  RESULTS: ${{ github.workspace }}/results.json

jobs:
  probe:
    name: ${{ matrix.runtime }} (${{ matrix.channel }})
    runs-on: ubuntu-latest
    # A probe finishes in under a minute; a call that never returns should not hold the run.
    timeout-minutes: 15
    env:
      # Logs each API before it is probed, so a hang shows where it stopped.
      PROBE_TRACE: '1'
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno, workerd]
        channel: [pinned, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # The repo declares pnpm, which setup-node would try to cache without it being installed.
          package-manager-cache: false
      - name: Resolve the version to probe
        id: version
        run: |
          if [ "${{ matrix.channel }}" = pinned ]; then
            echo "value=$(node -e "import('./$PROBE/data.mjs').then(m => console.log(m.pinnedVersion('${{ matrix.runtime }}')))")" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the list of APIs
        run: |
          flags="--drift"
          [ "${{ inputs.discover }}" = true ] && flags="$flags --discover"
          [ "${{ matrix.channel }}" = latest ] && flags="$flags --mocked"
          node "$PROBE/apis-cli.mjs" ${{ matrix.runtime }} $flags > "$SPEC"

      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.version.outputs.value }}
      - if: matrix.runtime == 'bun'
        run: bun "$PROBE/run.mjs" "$SPEC" "$RESULTS"

      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: ${{ steps.version.outputs.value == 'latest' && 'v2.x' || steps.version.outputs.value }}
      - if: matrix.runtime == 'deno'
        run: deno run -A "$PROBE/run.mjs" "$SPEC" "$RESULTS"

      - if: matrix.runtime == 'workerd'
        working-directory: ${{ runner.temp }}
        env:
          # The latest channel probes with the newest compatibility date its release accepts.
          PROBE_LATEST: ${{ matrix.channel == 'latest' && '1' || '0' }}
        run: |
          npm init -y > /dev/null
          npm install workerd@${{ steps.version.outputs.value }}
          node "$GITHUB_WORKSPACE/$PROBE/workerd/run.mjs" "$SPEC" "$RESULTS"

      - name: Summarize
        run: node "$PROBE/summarize.mjs" ${{ matrix.runtime }} ${{ matrix.channel }} "$RESULTS" probes | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-${{ matrix.runtime }}-${{ matrix.channel }}
          path: |
            results.json
            drift.json
            probes/
          if-no-files-found: ignore

  report:
    name: Data drift issue
    needs: probe
    # Only the weekly run, or a manual one that asks for it, writes to the issue tracker.
    if: github.event_name == 'schedule' || inputs.open-issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: probe-*-latest
          path: reports
      - name: Write the issue text
        id: drift
        run: node "$PROBE/drift-issue.mjs" reports "$RUNNER_TEMP/body.md"
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRIFT: ${{ steps.drift.outputs.drift }}
          TITLE: The compatibility data is behind the latest runtimes
        run: |
          number=$(gh issue list --state open --label data --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ "$DRIFT" = true ] && [ -z "$number" ]; then
            gh issue create --title "$TITLE" --label data --body-file "$RUNNER_TEMP/body.md"
          elif [ "$DRIFT" = true ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "The pinned data agrees with the latest releases again."
          fi
