version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    ignore:
      # Types follow the oldest Node.js the package supports (engines), not the latest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    exclude-paths:
      - test/fixtures/**
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The sample apps pin exact versions. A bump is reviewed: read the result again before
  # changing an expectation.
  - package-ecosystem: npm
    directory: /apps
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      apps:
        patterns: ['*']
